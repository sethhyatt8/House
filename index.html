<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>House</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1915;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(440px, calc(100vw - 32px));
        color: #f7f2ea;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
        pointer-events: none;
      }
      #status {
        font-size: 16px;
        font-weight: 650;
      }
      #watch-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: min(240px, calc(100vw - 32px));
        padding: 10px 12px 12px;
        border-radius: 10px;
        background: rgba(22, 24, 28, 0.82);
        color: #f7f2ea;
        font-size: 14px;
      }
      #room-line {
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      #room-code {
        font-size: 22px;
        letter-spacing: 0.14em;
      }
      #watch-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      #watch-code {
        flex: 1;
        min-width: 0;
        padding: 6px 8px;
        border: 0;
        border-radius: 6px;
        background: #2a3038;
        color: #f7f2ea;
        font: inherit;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #watch-form button,
      #watch-leave {
        border: 0;
        border-radius: 6px;
        background: #1f7a45;
        color: #f7fff8;
        font: inherit;
        font-weight: 650;
        padding: 6px 10px;
        text-decoration: none;
      }
      #watch-note {
        margin-top: 6px;
        min-height: 1.2em;
        opacity: 0.86;
      }
      #watch-panel {
        z-index: 6;
      }
      #loading {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(22, 24, 28, 0.92);
        color: #f7f2ea;
      }
      #loading[hidden] {
        display: none;
      }
      #loading .panel {
        width: min(280px, calc(100vw - 48px));
      }
      #loading .label {
        margin-bottom: 10px;
        font-weight: 650;
      }
      #loading .track {
        height: 8px;
        border-radius: 6px;
        background: #2a3038;
        overflow: hidden;
      }
      #loading-bar {
        width: 0%;
        height: 100%;
        background: #1f7a45;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="panel">
        <div class="label">Loading</div>
        <div class="track"><div id="loading-bar"></div></div>
      </div>
    </div>
    <div id="watch-panel">
      <div id="room-line"><span id="room-label">Room</span> <strong id="room-code">----</strong></div>
      <form id="watch-form">
        <input id="watch-code" maxlength="4" autocomplete="off" spellcheck="false" placeholder="Code" />
        <button type="submit">Watch</button>
      </form>
      <div id="watch-note"></div>
    </div>
    <div id="hud">
      <div id="status"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
